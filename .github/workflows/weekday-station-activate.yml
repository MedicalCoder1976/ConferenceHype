name: Activate weekday station after morning release

on:
  workflow_dispatch:
    inputs:
      schedule_date:
        description: "America/New_York date (YYYY-MM-DD); blank means today"
        required: false
        default: ""
  schedule:
    - cron: "45 10 * * 1-5"
    - cron: "45 11 * * 1-5"

permissions:
  contents: read

concurrency:
  group: weekday-station-activation
  cancel-in-progress: false

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - name: Activate one-release schedule after the 6:15 AM publication
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REQUESTED_DATE: ${{ inputs.schedule_date }}
        shell: bash
        run: |
          TARGET_DATE="$REQUESTED_DATE"
          if [ -z "$TARGET_DATE" ]; then
            HOUR=$(TZ=America/New_York date +%H)
            if [ "$((10#$HOUR))" -lt 6 ]; then echo 'Release window has not opened yet.'; exit 0; fi
            TARGET_DATE=$(TZ=America/New_York date +%F)
          fi
          DOW=$(TZ=America/New_York date -d "$TARGET_DATE" +%u)
          if [ "$DOW" -gt 5 ]; then echo "Refusing weekend activation for $TARGET_DATE"; exit 1; fi
          SCHEDULE_ID=$(curl --fail --silent --show-error --get "${SUPABASE_URL}/rest/v1/station_daily_schedules" -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" --data-urlencode "select=id" --data-urlencode "schedule_date=eq.${TARGET_DATE}" | jq -er '.[0].id')
          curl --fail --silent --show-error "${SUPABASE_URL}/rest/v1/rpc/activate_station_schedule" -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" -H "Content-Type: application/json" -d "{\"p_schedule_id\":\"${SCHEDULE_ID}\"}" | jq -e '.status == "active"'
