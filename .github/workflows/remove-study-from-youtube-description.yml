name: Remove a study from a YouTube description

on:
  workflow_dispatch:
    inputs:
      video_id:
        description: "Owned YouTube video ID"
        required: true
      study_name:
        description: "Study exactly as listed under 'Studies covered' (also removes its hashtag and tag)"
        required: true

permissions:
  contents: read

jobs:
  remove-study:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Update description on YouTube and the stored record
        run: npx tsx scripts/remove-study-from-youtube-description.ts
        env:
          YOUTUBE_VIDEO_ID: ${{ inputs.video_id }}
          STUDY_NAME: ${{ inputs.study_name }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID }}
          YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRET }}
          YOUTUBE_OAUTH_REFRESH_TOKEN: ${{ secrets.YOUTUBE_OAUTH_REFRESH_TOKEN }}
