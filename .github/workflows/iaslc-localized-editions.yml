name: IASLC localized editions

on:
  workflow_dispatch:
    inputs:
      broadcast_id:
        description: Verified source broadcast ID
        required: true
        type: string
      language:
        description: Language edition
        required: true
        type: choice
        options: [ko, ja]
      publish:
        description: Publish the exact reviewed render from source_run_id
        default: false
        type: boolean
      source_run_id:
        description: Reviewed generation run ID, required for publishing
        default: ""
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: reviewed-L4TufVGhKOI-${{ inputs.language }}
  cancel-in-progress: false
jobs:
  edition:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Validate exact source
        env:
          SOURCE_ID: ${{ inputs.broadcast_id }}
        run: test "$SOURCE_ID" = "0703aa1a-dfeb-4d6f-bf7e-32fbf2cea688"
      - name: Install render dependencies
        if: ${{ !inputs.publish }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          pip install edge-tts==7.2.7 Pillow==11.3.0
      - name: Render reviewed translation
        if: ${{ !inputs.publish }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/render-reviewed-L4TufVGhKOI.py --language "${{ inputs.language }}"
      - name: Download reviewed edition
        if: ${{ inputs.publish }}
        uses: actions/download-artifact@v4
        with:
          name: reviewed-L4TufVGhKOI-${{ inputs.language }}
          path: localized-output
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: Verify reviewed file and release
        if: ${{ inputs.publish }}
        env:
          YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID }}
          YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRET }}
          YOUTUBE_OAUTH_REFRESH_TOKEN: ${{ secrets.YOUTUBE_OAUTH_REFRESH_TOKEN }}
          EDITION_LANGUAGE: ${{ inputs.language }}
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib
          p=pathlib.Path("localized-output")/("0703aa1a-dfeb-4d6f-bf7e-32fbf2cea688-"+os.environ["EDITION_LANGUAGE"]+".json")
          m=json.loads(p.read_text())
          assert m["source_video_id"]=="L4TufVGhKOI"
          assert hashlib.sha256(pathlib.Path(m["video_path"]).read_bytes()).hexdigest()==m["video_sha256"]
          PY
          npx tsx scripts/publish-reviewed-L4TufVGhKOI.ts "localized-output/0703aa1a-dfeb-4d6f-bf7e-32fbf2cea688-${{ inputs.language }}.json"
      - name: Save review and delivery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reviewed-L4TufVGhKOI-${{ inputs.language }}
          path: localized-output/
          retention-days: 7
