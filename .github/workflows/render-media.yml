name: Publish reviewed Mandarin WCLC edition
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mandarin-day2-289afedf
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Download reviewed Mandarin assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .tmp/mandarin-289afedf
          gh api -H 'Accept: application/octet-stream' repos/MedicalCoder1976/ConferenceHype/releases/assets/562201954 > .tmp/mandarin-289afedf/qa.json
          gh api -H 'Accept: application/octet-stream' repos/MedicalCoder1976/ConferenceHype/releases/assets/562201952 > .tmp/mandarin-289afedf/release.json
          gh api -H 'Accept: application/octet-stream' repos/MedicalCoder1976/ConferenceHype/releases/assets/562201953 > .tmp/mandarin-289afedf/thumbnail.png
          gh api -H 'Accept: application/octet-stream' repos/MedicalCoder1976/ConferenceHype/releases/assets/562201958 > .tmp/mandarin-289afedf/wclc-china-289afedf-zh.mp4
          gh api -H 'Accept: application/octet-stream' repos/MedicalCoder1976/ConferenceHype/releases/assets/562201951 > .tmp/mandarin-289afedf/wclc-china-289afedf-zh.srt
      - name: Publish reviewed Mandarin video
        env:
          YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID }}
          YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRET }}
          YOUTUBE_OAUTH_REFRESH_TOKEN: ${{ secrets.YOUTUBE_OAUTH_REFRESH_TOKEN }}
        run: npx tsx scripts/publish-reviewed-korean.ts --verify
      - name: Preserve publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mandarin-day2-289afedf-evidence
          path: .tmp/mandarin-289afedf/youtube-result.json
