name: Publish reviewed Korean WCLC edition
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: korean-wclc-20260912
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Download reviewed Korean assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .tmp/korean-release
          gh api -H 'Accept: application/octet-stream' repos/MedicalCoder1976/ConferenceHype/releases/assets/560135220 > .tmp/korean-release/qa.json
          gh api -H 'Accept: application/octet-stream' repos/MedicalCoder1976/ConferenceHype/releases/assets/560135217 > .tmp/korean-release/release.json
          gh api -H 'Accept: application/octet-stream' repos/MedicalCoder1976/ConferenceHype/releases/assets/560135216 > .tmp/korean-release/thumbnail.png
          gh api -H 'Accept: application/octet-stream' repos/MedicalCoder1976/ConferenceHype/releases/assets/560135219 > .tmp/korean-release/wclc-seoul-2026-ko.mp4
          gh api -H 'Accept: application/octet-stream' repos/MedicalCoder1976/ConferenceHype/releases/assets/560135218 > .tmp/korean-release/wclc-seoul-2026-ko.srt
      - name: Publish reviewed Korean video
        env:
          YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID }}
          YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRET }}
          YOUTUBE_OAUTH_REFRESH_TOKEN: ${{ secrets.YOUTUBE_OAUTH_REFRESH_TOKEN }}
        run: npx tsx scripts/publish-reviewed-korean.ts --publish
      - name: Preserve publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: korean-wclc-publication-evidence
          path: .tmp/korean-release/youtube-result.json

