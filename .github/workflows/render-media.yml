name: Publish reviewed Korean WCLC edition
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: korean-day2-289afedf
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Download reviewed Korean assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .tmp/korean-289afedf
          gh api -H 'Accept: application/octet-stream' repos/MedicalCoder1976/ConferenceHype/releases/assets/561977833 > .tmp/korean-289afedf/qa.json
          gh api -H 'Accept: application/octet-stream' repos/MedicalCoder1976/ConferenceHype/releases/assets/561977840 > .tmp/korean-289afedf/release.json
          gh api -H 'Accept: application/octet-stream' repos/MedicalCoder1976/ConferenceHype/releases/assets/561977845 > .tmp/korean-289afedf/thumbnail.png
          gh api -H 'Accept: application/octet-stream' repos/MedicalCoder1976/ConferenceHype/releases/assets/561977832 > .tmp/korean-289afedf/wclc-day2-289afedf-ko.mp4
          gh api -H 'Accept: application/octet-stream' repos/MedicalCoder1976/ConferenceHype/releases/assets/561977844 > .tmp/korean-289afedf/wclc-day2-289afedf-ko.srt
      - name: Publish reviewed Korean video
        env:
          YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID }}
          YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRET }}
          YOUTUBE_OAUTH_REFRESH_TOKEN: ${{ secrets.YOUTUBE_OAUTH_REFRESH_TOKEN }}
        run: npx tsx scripts/publish-reviewed-korean.ts --publish
      - name: Preserve publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: korean-day2-289afedf-evidence
          path: .tmp/korean-289afedf/youtube-result.json
