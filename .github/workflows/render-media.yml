name: Publish reviewed Korean Mandarin Japanese WCLC Story
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [publish, verify, inspect]
        default: verify
        description: Publish reviewed editions or verify existing uploads
permissions:
  contents: read
concurrency:
  group: asia-wclc-20260914-${{ inputs.mode }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: ko
            sha256: c9356c65fa6f1458eb67c7314147a694845a6f882bf4e49d8d9daa7251825eaf
          - language: zh
            sha256: cc7b37b8dd42afec634ecfc0a75742bd647452868bc032a31d36ebc8f50a3fc2
          - language: ja
            sha256: be56db0320e86aab60b8f195a3ca943de4f14724dfcdd4877f5ab0977e7c32af
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Download and verify reviewed edition
        env:
          GH_TOKEN: ${{ github.token }}
          EDITION: ${{ matrix.language }}
          EXPECTED_SHA: ${{ matrix.sha256 }}
        run: |
          gh release download asia-wclc-20260914 --pattern "$EDITION.zip" --dir assets
          echo "$EXPECTED_SHA  assets/$EDITION.zip" | sha256sum --check
          mkdir edition
          unzip "assets/$EDITION.zip" -d edition
      - name: Publish or verify exact edition
        env:
          YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID }}
          YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRET }}
          YOUTUBE_OAUTH_REFRESH_TOKEN: ${{ secrets.YOUTUBE_OAUTH_REFRESH_TOKEN }}
          EDITION: ${{ matrix.language }}
          MODE: ${{ inputs.mode }}
        run: npx tsx scripts/publish-asia-wclc.ts "$EDITION" "--$MODE"
      - name: Preserve delivery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asia-wclc-${{ matrix.language }}-delivery
          path: edition/youtube-result.json

