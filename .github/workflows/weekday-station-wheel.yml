name: Weekday station wheel

on:
  workflow_dispatch:
    inputs:
      schedule_date:
        description: "America/New_York date (YYYY-MM-DD); blank means today"
        required: false
        default: ""
  schedule:
    - cron: "30 11 * * 1-5"

permissions:
  contents: read

concurrency:
  group: weekday-station-wheel
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.prepare.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Resolve Eastern weekday
        id: day
        shell: bash
        run: |
          TARGET="${{ inputs.schedule_date }}"
          if [ -z "$TARGET" ]; then TARGET=$(TZ=America/New_York date +%F); fi
          DOW=$(TZ=America/New_York date -d "$TARGET" +%u)
          if [ "$DOW" -gt 5 ]; then echo "Refusing weekend schedule for $TARGET"; exit 1; fi
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
      - name: Reserve six new non-repeating journal programs
        id: prepare
        run: npx tsx scripts/prepare-weekday-station.ts
        env:
          STATION_SCHEDULE_DATE: ${{ steps.day.outputs.target }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  render:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        program: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    uses: ./.github/workflows/station-program.yml
    with:
      station_program_id: ${{ matrix.program.station_program_id }}
      journal_id: ${{ matrix.program.journal_id }}
      stream_start_time: ${{ matrix.program.stream_start_time }}
    secrets: inherit

  activate:
    needs: [prepare, render]
    runs-on: ubuntu-latest
    steps:
      - name: Activate only after all six new videos verify
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TARGET_DATE: ${{ inputs.schedule_date }}
        shell: bash
        run: |
          if [ -z "$TARGET_DATE" ]; then TARGET_DATE=$(TZ=America/New_York date +%F); fi
          SCHEDULE_ID=$(curl --fail --silent --show-error --get "${SUPABASE_URL}/rest/v1/station_daily_schedules" -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" --data-urlencode "select=id" --data-urlencode "schedule_date=eq.${TARGET_DATE}" | jq -er '.[0].id')
          curl --fail --silent --show-error "${SUPABASE_URL}/rest/v1/rpc/activate_station_schedule" -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" -H "Content-Type: application/json" -d "{\"p_schedule_id\":\"${SCHEDULE_ID}\"}" | jq -e '.status == "active"'