name: Weekday station wheel

on:
  workflow_dispatch:
    inputs:
      schedule_date:
        description: "America/New_York release date (YYYY-MM-DD); blank means tomorrow"
        required: false
        default: ""
  schedule:
    # One UTC cron avoids duplicate DST runs. At 03:30 UTC it is still the
    # prior evening in New York in both EST and EDT. GitHub may start late,
    # so the intended release date comes from the UTC cron date, not wall time.
    - cron: "30 3 * * 1-5"

permissions:
  contents: read

concurrency:
  group: weekday-station-wheel
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.prepare.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Resolve next Eastern weekday release
        id: day
        shell: bash
        run: |
          TARGET="${{ inputs.schedule_date }}"
          if [ -z "$TARGET" ]; then
            TARGET=$(date -u +%F)
          fi
          DOW=$(TZ=America/New_York date -d "$TARGET" +%u)
          if [ "$DOW" -gt 5 ]; then echo "Refusing weekend schedule for $TARGET"; exit 1; fi
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
      - name: Reserve one top-journal program for next-morning release
        id: prepare
        if: steps.day.outputs.target != ''
        run: npx tsx scripts/prepare-weekday-station.ts
        env:
          STATION_SCHEDULE_DATE: ${{ steps.day.outputs.target }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  render:
    needs: prepare
    if: needs.prepare.outputs.matrix != ''
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        program: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    uses: ./.github/workflows/station-program.yml
    with:
      station_program_id: ${{ matrix.program.station_program_id }}
      journal_id: ${{ matrix.program.journal_id }}
      stream_start_time: ${{ matrix.program.stream_start_time }}
      youtube_publish_at: ${{ matrix.program.youtube_publish_at }}
    secrets: inherit
